## Зависимости IP-Radio из реестра компонентов Espressif.
##
## Версии esp_wifi_remote и esp_hosted взяты НЕ наугад: это диапазоны,
## заявленные в манифесте примера Wi-Fi самой Waveshare и проверяемые
## сборкой в их CI (docs/26-firmware-spec.md, §2.4):
##
##   ветка ESP-IDF        esp_wifi_remote   esp_hosted
##   до 6.0, вкл. v5.5.5  0.14.*            1.4.*
##   6.0 и новее          >=1.6,<2.0        >=2.12,<3.0
##
## ESP-ADF закрепляет ESP-IDF v5.5.3 подмодулем, то есть мы в первой строке.
## Драйверу панели нужен IDF не ниже 5.3 — тоже выполняется.
##
## ВАЖНО: при смене ветки ADF или IDF эту таблицу надо перечитать заново.
## Успешная сборка не доказывает связь с конкретным образом прошивки C6 —
## об этом предупреждает сама Waveshare.

dependencies:
  idf:
    version: ">=5.3"

  ## Плата: BSP и драйвер панели. Проверено 2026-08-26, оба существуют
  ## в реестре и заявлены под цель esp32p4.
  waveshare/esp32_p4_wifi6_touch_lcd_5:
    version: "^1.0.4"
  waveshare/esp_lcd_hx8394:
    version: "^2.1.0"

  ## Wi-Fi через сопроцессор ESP32-C6. Версии — по таблице выше.
  espressif/esp_wifi_remote:
    version: "0.14.*"
  espressif/esp_hosted:
    version: "1.4.*"

  ## Интерфейс.
  lvgl/lvgl:
    version: "^9.2"

## Компонент esp-extconn в проекте быть НЕ должен: он несовместим
## с esp_hosted (docs/26-firmware-spec.md, §3). Если он подтянется
## транзитивно — исключить.
