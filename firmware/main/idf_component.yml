## Зависимости IP-Radio из реестра компонентов Espressif.
##
## ВНИМАНИЕ: здесь закреплены версии под ПЕРВУЮ сборку, задача которой —
## поднять плату и сеть. ESP-ADF в этот набор пока НЕ входит, и это
## осознанно, см. ниже.
##
## Версии esp_wifi_remote и esp_hosted взяты из манифеста Wi-Fi-примера
## самой Waveshare (docs/26-firmware-spec.md, §2.4): при ветке IDF ниже 6.0
## это esp_wifi_remote 0.14.* и esp_hosted 1.4.*. Они согласованы
## с заводским образом прошивки сопроцессора C6, залитым на нашу плату.
##
## ── Конфликт, обнаруженный 2026-08-27 ────────────────────────────────
## Манифест примера ESP-ADF для той же цели требует esp_hosted ^2.6.4
## при IDF 5.4 и выше. С 1.4.* эти диапазоны НЕ пересекаются.
## Причина расхождения: Waveshare отвечает на вопрос «какой хост говорит
## с образом C6 на нашей плате», ADF — «с чем проверялся я сам».
##
## Поэтому порядок такой: сначала поднимаем сеть по версиям Waveshare
## и убеждаемся, что сопроцессор отвечает. И только потом добавляем ADF —
## тогда будет понятно, что именно сломалось, если сломается.
## Разбор и три пути выхода — docs/26-firmware-spec.md, §2.4.

dependencies:
  idf:
    ## ADF release/v2.x поддерживает 5.1…5.5 (проверено по его README),
    ## драйверу панели нужен не ниже 5.3. Пересечение: 5.3…5.5.
    version: ">=5.3,<5.6"

  ## Плата: BSP и драйвер панели. Проверено 2026-08-26, оба существуют
  ## в реестре и заявлены под цель esp32p4.
  waveshare/esp32_p4_wifi6_touch_lcd_5:
    version: "^1.0.4"
  waveshare/esp_lcd_hx8394:
    version: "^2.1.0"

  ## Wi-Fi через сопроцессор ESP32-C6 — версии Waveshare, см. выше.
  espressif/esp_wifi_remote:
    version: "0.14.*"
  espressif/esp_hosted:
    version: "1.4.*"

  ## Интерфейс.
  lvgl/lvgl:
    version: "^9.2"

## Про esp-extconn: в предупреждении из сторонних источников говорилось,
## что его надо удалить как несовместимый с esp_hosted. Проверено
## 2026-08-27 по склонированному ADF — такого компонента там нет вовсе,
## так что к нашей сборке предупреждение не относится.
