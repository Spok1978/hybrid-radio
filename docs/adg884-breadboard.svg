<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="980" height="640" fill="#ffffff"/>
  <style>
    .w  { stroke:#1a1a1a; stroke-width:2; fill:none; }
    .c  { stroke:#8b1a1a; stroke-width:3; fill:none; }
    .box{ stroke:#8b1a1a; stroke-width:2.5; fill:#fdf8e3; }
    .t  { font-size:15px; fill:#1a1a1a; }
    .tp { font-size:14px; fill:#8b1a1a; }
    .tt { font-size:19px; font-weight:bold; fill:#1a1a1a; }
    .pad{ stroke:#1a7a1a; stroke-width:2.5; fill:#eaf7ea; }
    .dot{ fill:#1a7a1a; }
  </style>

  <text class="tt" x="26" y="34">Узел на ADG884 — отдельная плата, внешних соединений пока нет</text>

  <!-- микросхема -->
  <rect class="box" x="420" y="150" width="200" height="250"/>
  <text class="tt" x="450" y="192">ADG884</text>
  <text class="tp" x="426" y="238">2  S1A</text>
  <text class="tp" x="426" y="300">5  S1B</text>
  <text class="tp" x="426" y="352">4  IN1</text>
  <text class="tp" x="426" y="374">8  IN2</text>
  <text class="tp" x="566" y="238">D1  3</text>
  <text class="tp" x="558" y="272">VDD  1</text>
  <text class="tp" x="558" y="330">GND  6</text>
  <text class="tp" x="440" y="424">7, 9, 10 — не подключать</text>

  <!-- вход A -->
  <rect class="pad" x="26" y="218" width="86" height="26"/>
  <text class="t" x="36" y="237">X1 вход A</text>
  <line class="w" x1="112" y1="231" x2="176" y2="231"/>
  <line class="c" x1="176" y1="215" x2="176" y2="247"/>
  <line class="c" x1="188" y1="215" x2="188" y2="247"/>
  <text class="tp" x="156" y="206">C1 2,2 мк</text>
  <line class="w" x1="188" y1="231" x2="420" y2="231"/>
  <circle class="dot" cx="300" cy="231" r="4"/>

  <!-- вход B -->
  <rect class="pad" x="26" y="280" width="86" height="26"/>
  <text class="t" x="36" y="299">X2 вход B</text>
  <line class="w" x1="112" y1="293" x2="176" y2="293"/>
  <line class="c" x1="176" y1="277" x2="176" y2="309"/>
  <line class="c" x1="188" y1="277" x2="188" y2="309"/>
  <text class="tp" x="156" y="330">C2 2,2 мк</text>
  <line class="w" x1="188" y1="293" x2="420" y2="293"/>
  <circle class="dot" cx="240" cy="293" r="4"/>

  <!-- R1 к смещению -->
  <line class="w" x1="300" y1="231" x2="300" y2="452"/>
  <rect class="c" x="290" y="360" width="20" height="46"/>
  <text class="tp" x="314" y="388">R1 100к</text>

  <!-- R2 к смещению -->
  <line class="w" x1="240" y1="293" x2="240" y2="452"/>
  <rect class="c" x="230" y="360" width="20" height="46"/>
  <text class="tp" x="150" y="388">R2 100к</text>

  <!-- шина смещения -->
  <line class="w" x1="150" y1="452" x2="300" y2="452"/>
  <circle class="dot" cx="240" cy="452" r="4"/>
  <circle class="dot" cx="300" cy="452" r="4"/>
  <text class="t" x="248" y="478">BIAS 1,65 В</text>

  <!-- делитель смещения -->
  <line class="w" x1="150" y1="452" x2="150" y2="392"/>
  <rect class="c" x="140" y="346" width="20" height="46"/>
  <text class="tp" x="60" y="374">R3 10к</text>
  <line class="w" x1="150" y1="346" x2="150" y2="300"/>
  <line class="w" x1="150" y1="300" x2="66" y2="300"/>
  <line class="w" x1="66" y1="300" x2="66" y2="360"/>

  <line class="w" x1="150" y1="452" x2="150" y2="500"/>
  <rect class="c" x="140" y="500" width="20" height="46"/>
  <text class="tp" x="60" y="528">R4 10к</text>
  <line class="w" x1="150" y1="546" x2="150" y2="576"/>
  <line class="w" x1="120" y1="576" x2="180" y2="576"/>
  <line class="w" x1="132" y1="584" x2="168" y2="584"/>
  <line class="w" x1="142" y1="592" x2="158" y2="592"/>
  <circle class="dot" cx="150" cy="452" r="4"/>

  <!-- C3 по смещению -->
  <line class="w" x1="300" y1="452" x2="360" y2="452"/>
  <line class="c" x1="344" y1="490" x2="376" y2="490"/>
  <line class="c" x1="344" y1="502" x2="376" y2="502"/>
  <line class="w" x1="360" y1="452" x2="360" y2="490"/>
  <text class="tp" x="384" y="502">C3 10 мк</text>
  <line class="w" x1="360" y1="502" x2="360" y2="540"/>
  <line class="w" x1="330" y1="540" x2="390" y2="540"/>
  <line class="w" x1="342" y1="548" x2="378" y2="548"/>
  <line class="w" x1="352" y1="556" x2="368" y2="556"/>

  <!-- выход -->
  <line class="w" x1="620" y1="231" x2="700" y2="231"/>
  <line class="c" x1="700" y1="215" x2="700" y2="247"/>
  <line class="c" x1="712" y1="215" x2="712" y2="247"/>
  <text class="tp" x="678" y="206">C4 3,3 мк</text>
  <line class="w" x1="712" y1="231" x2="800" y2="231"/>
  <rect class="pad" x="800" y="218" width="96" height="26"/>
  <text class="t" x="810" y="237">X3 выход</text>

  <!-- питание -->
  <line class="w" x1="620" y1="266" x2="740" y2="266"/>
  <rect class="pad" x="800" y="253" width="96" height="26"/>
  <text class="t" x="808" y="272">X5 +3,3 В</text>
  <line class="w" x1="740" y1="266" x2="800" y2="266"/>
  <circle class="dot" cx="740" cy="266" r="4"/>
  <line class="w" x1="740" y1="266" x2="740" y2="310"/>
  <line class="c" x1="724" y1="310" x2="756" y2="310"/>
  <line class="c" x1="724" y1="322" x2="756" y2="322"/>
  <text class="tp" x="764" y="322">C5 0,1 мк</text>
  <line class="w" x1="740" y1="322" x2="740" y2="356"/>
  <line class="w" x1="710" y1="356" x2="770" y2="356"/>
  <line class="w" x1="722" y1="364" x2="758" y2="364"/>
  <line class="w" x1="732" y1="372" x2="748" y2="372"/>

  <!-- земля микросхемы -->
  <line class="w" x1="620" y1="324" x2="660" y2="324"/>
  <line class="w" x1="660" y1="324" x2="660" y2="420"/>
  <line class="w" x1="660" y1="420" x2="800" y2="420"/>
  <rect class="pad" x="800" y="407" width="96" height="26"/>
  <text class="t" x="822" y="426">X6 GND</text>

  <!-- управление -->
  <line class="w" x1="420" y1="346" x2="330" y2="346"/>
  <line class="w" x1="420" y1="368" x2="366" y2="368"/>
  <line class="w" x1="366" y1="368" x2="366" y2="346"/>
  <circle class="dot" cx="366" cy="346" r="4"/>
  <line class="w" x1="330" y1="346" x2="330" y2="612"/>
  <line class="w" x1="330" y1="612" x2="700" y2="612"/>
  <rect class="pad" x="700" y="599" width="126" height="26"/>
  <text class="t" x="710" y="618">X4 управление</text>
</svg>
