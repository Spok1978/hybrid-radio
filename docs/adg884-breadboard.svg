<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <style>
    .w  { stroke:#1a1a1a; stroke-width:2; fill:none; }
    .c  { stroke:#8b1a1a; stroke-width:3; fill:none; }
    .box{ stroke:#8b1a1a; stroke-width:2.5; fill:#fdf8e3; }
    .t  { font-size:15px; fill:#1a1a1a; }
    .tp { font-size:14px; fill:#8b1a1a; }
    .tt { font-size:19px; font-weight:bold; fill:#1a1a1a; }
    .pad{ stroke:#1a7a1a; stroke-width:2.5; fill:#eaf7ea; }
    .dot{ fill:#1a7a1a; }
  </style>

  <text class="tt" x="26" y="34">Узел на ADG884 — отдельная плата, внешних соединений пока нет</text>

  <!-- микросхема -->
  <rect class="box" x="420" y="170" width="200" height="250"/>
  <text class="tt" x="452" y="212">ADG884</text>
  <text class="tp" x="426" y="256">2  S1A</text>
  <text class="tp" x="426" y="318">5  S1B</text>
  <text class="tp" x="426" y="370">4  IN1</text>
  <text class="tp" x="426" y="392">8  IN2</text>
  <text class="tp" x="566" y="256">D1  3</text>
  <text class="tp" x="558" y="292">VDD  1</text>
  <text class="tp" x="558" y="350">GND  6</text>
  <text class="tp" x="440" y="412">7, 9, 10 — не подключать</text>

  <!-- вход A -->
  <rect class="pad" x="26" y="237" width="90" height="26"/>
  <text class="t" x="34" y="256">X1 вход A</text>
  <line class="w" x1="116" y1="250" x2="176" y2="250"/>
  <line class="c" x1="176" y1="234" x2="176" y2="266"/>
  <line class="c" x1="188" y1="234" x2="188" y2="266"/>
  <text class="tp" x="156" y="226">C1 2,2 мк</text>
  <line class="w" x1="188" y1="250" x2="420" y2="250"/>
  <circle class="dot" cx="340" cy="250" r="4"/>

  <!-- вход B -->
  <rect class="pad" x="26" y="299" width="90" height="26"/>
  <text class="t" x="34" y="318">X2 вход B</text>
  <line class="w" x1="116" y1="312" x2="176" y2="312"/>
  <line class="c" x1="176" y1="296" x2="176" y2="328"/>
  <line class="c" x1="188" y1="296" x2="188" y2="328"/>
  <text class="tp" x="156" y="350">C2 2,2 мк</text>
  <line class="w" x1="188" y1="312" x2="420" y2="312"/>
  <circle class="dot" cx="260" cy="312" r="4"/>

  <!-- R1: S1A к смещению -->
  <line class="w" x1="340" y1="250" x2="340" y2="500"/>
  <rect class="c" x="330" y="380" width="20" height="46"/>
  <text class="tp" x="356" y="408">R1 100к</text>

  <!-- R2: S1B к смещению -->
  <line class="w" x1="260" y1="312" x2="260" y2="500"/>
  <rect class="c" x="250" y="380" width="20" height="46"/>
  <text class="tp" x="166" y="408">R2 100к</text>

  <!-- шина смещения -->
  <line class="w" x1="260" y1="500" x2="700" y2="500"/>
  <circle class="dot" cx="260" cy="500" r="4"/>
  <circle class="dot" cx="340" cy="500" r="4"/>
  <circle class="dot" cx="300" cy="500" r="4"/>
  <circle class="dot" cx="440" cy="500" r="4"/>
  <text class="t" x="470" y="492">BIAS 1,65 В</text>

  <!-- C3 по смещению -->
  <line class="w" x1="300" y1="500" x2="300" y2="524"/>
  <line class="c" x1="284" y1="524" x2="316" y2="524"/>
  <line class="c" x1="284" y1="536" x2="316" y2="536"/>
  <text class="tp" x="196" y="538">C3 10 мк</text>
  <line class="w" x1="300" y1="536" x2="300" y2="566"/>
  <line class="w" x1="272" y1="566" x2="328" y2="566"/>
  <line class="w" x1="283" y1="574" x2="317" y2="574"/>
  <line class="w" x1="292" y1="582" x2="308" y2="582"/>

  <!-- R4: нижнее плечо делителя -->
  <line class="w" x1="440" y1="500" x2="440" y2="520"/>
  <rect class="c" x="430" y="520" width="20" height="46"/>
  <text class="tp" x="456" y="548">R4 10к</text>
  <line class="w" x1="440" y1="566" x2="440" y2="596"/>
  <line class="w" x1="412" y1="596" x2="468" y2="596"/>
  <line class="w" x1="423" y1="604" x2="457" y2="604"/>
  <line class="w" x1="432" y1="612" x2="448" y2="612"/>

  <!-- R3: верхнее плечо делителя, к +3,3 В -->
  <line class="w" x1="700" y1="500" x2="700" y2="436"/>
  <rect class="c" x="690" y="390" width="20" height="46"/>
  <text class="tp" x="716" y="418">R3 10к</text>
  <line class="w" x1="700" y1="390" x2="700" y2="286"/>
  <circle class="dot" cx="700" cy="286" r="4"/>
  <circle class="dot" cx="700" cy="500" r="4"/>

  <!-- выход -->
  <line class="w" x1="620" y1="250" x2="700" y2="250"/>
  <line class="c" x1="700" y1="234" x2="700" y2="266"/>
  <line class="c" x1="712" y1="234" x2="712" y2="266"/>
  <text class="tp" x="678" y="226">C4 3,3 мк</text>
  <line class="w" x1="712" y1="250" x2="880" y2="250"/>
  <rect class="pad" x="880" y="237" width="96" height="26"/>
  <text class="t" x="890" y="256">X3 выход</text>

  <!-- питание -->
  <line class="w" x1="620" y1="286" x2="880" y2="286"/>
  <rect class="pad" x="880" y="273" width="96" height="26"/>
  <text class="t" x="888" y="292">X5 +3,3 В</text>
  <circle class="dot" cx="770" cy="286" r="4"/>
  <circle class="dot" cx="830" cy="286" r="4"/>

  <line class="w" x1="770" y1="286" x2="770" y2="320"/>
  <line class="c" x1="754" y1="320" x2="786" y2="320"/>
  <line class="c" x1="754" y1="332" x2="786" y2="332"/>
  <text class="tp" x="662" y="334">C5 0,1 мк</text>
  <line class="w" x1="770" y1="332" x2="770" y2="362"/>
  <line class="w" x1="742" y1="362" x2="798" y2="362"/>
  <line class="w" x1="753" y1="370" x2="787" y2="370"/>
  <line class="w" x1="762" y1="378" x2="778" y2="378"/>

  <line class="w" x1="830" y1="286" x2="830" y2="320"/>
  <line class="c" x1="814" y1="320" x2="846" y2="320"/>
  <line class="c" x1="814" y1="332" x2="846" y2="332"/>
  <text class="tp" x="854" y="332">C6 10 мк</text>
  <line class="w" x1="830" y1="332" x2="830" y2="362"/>
  <line class="w" x1="802" y1="362" x2="858" y2="362"/>
  <line class="w" x1="813" y1="370" x2="847" y2="370"/>
  <line class="w" x1="822" y1="378" x2="838" y2="378"/>

  <!-- земля микросхемы -->
  <line class="w" x1="620" y1="344" x2="660" y2="344"/>
  <line class="w" x1="660" y1="344" x2="660" y2="628"/>
  <line class="w" x1="660" y1="628" x2="880" y2="628"/>
  <rect class="pad" x="880" y="615" width="96" height="26"/>
  <text class="t" x="902" y="634">X6 GND</text>

  <!-- управление -->
  <line class="w" x1="420" y1="364" x2="180" y2="364"/>
  <line class="w" x1="420" y1="386" x2="212" y2="386"/>
  <line class="w" x1="212" y1="386" x2="212" y2="364"/>
  <circle class="dot" cx="212" cy="364" r="4"/>
  <line class="w" x1="180" y1="364" x2="180" y2="628"/>
  <line class="w" x1="180" y1="628" x2="86" y2="628"/>
  <rect class="pad" x="26" y="615" width="60" height="26"/>
  <text class="t" x="30" y="634">X4</text>
  <text class="t" x="96" y="650">управление</text>
</svg>
